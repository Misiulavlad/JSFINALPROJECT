<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CyberCinema — Catalog</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <script>
    (() => {
      const themes = {
        red:{glow:'255,0,60',accent:'#ff003c'}, blue:{glow:'0,102,255',accent:'#0066ff'},
        green:{glow:'0,204,102',accent:'#00cc66'}, purple:{glow:'153,51,255',accent:'#9933ff'},
        cyan:{glow:'0,204,204',accent:'#00cccc'}, orange:{glow:'255,102,0',accent:'#ff6600'},
        pink:{glow:'255,51,153',accent:'#ff3399'}, yellow:{glow:'255,204,0',accent:'#ffcc00'}
      };
      const saved = localStorage.getItem('theme') || 'red';
      const t = themes[saved] || themes.red;
      const root = document.documentElement;
      const lang = localStorage.getItem('lang') || 'ru';
      document.documentElement.lang = lang;
      root.style.setProperty('--glow-color', t.glow);
      root.style.setProperty('--accent-color', t.accent);
      root.style.setProperty('--card-border', `rgba(${t.glow},0.4)`);
      root.style.setProperty('--blob-gradient', `radial-gradient(circle, rgba(${t.glow},0.4) 0%, rgba(${t.glow},0) 70%)`);
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-catalog.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="blobs-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <nav class="navbar">
    <a class="nav-logo" href="index.html">CYBER<span>CINEMA</span></a>

    <div class="nav-center">
      <a class="nav-btn active" href="index.html" data-i18n="nav.catalog">КАТАЛОГ</a>
      <a class="nav-btn" href="search.html" data-i18n="nav.search">ПОИСК</a>
      <a class="nav-btn" href="history.html" data-i18n="nav.history">ИСТОРИЯ</a>
      <a class="nav-btn" href="settings.html" data-i18n="nav.settings">НАСТРОЙКИ</a>
    </div>

    <div class="nav-actions">
      <button class="btn-auth" id="navAuthBtn" data-i18n="nav.loading">ЗАГРУЗКА...</button>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu"></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-nav">
      <a class="nav-btn active" href="index.html" data-i18n="nav.catalog">КАТАЛОГ</a>
      <a class="nav-btn" href="search.html" data-i18n="nav.search">ПОИСК</a>
      <a class="nav-btn" href="history.html" data-i18n="nav.history">ИСТОРИЯ</a>
      <a class="nav-btn" href="settings.html" data-i18n="nav.settings">НАСТРОЙКИ</a>
      <button class="btn-auth" id="mobileAuthBtn" data-i18n="nav.loading">ЗАГРУЗКА...</button>
    </div>
  </div>

  <main class="main">
    <div class="movies-container">
      <div class="movies-header">
        <h1 data-i18n="catalog.title">РЕКОМЕНДАЦИИ СИСТЕМЫ</h1>
      </div>
      <div class="movies-grid" id="moviesGrid"></div>
    </div>
  </main>

  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <span class="close-modal" id="closeAuthModal">×</span>

      <div id="loginForm">
        <h2 class="auth-title" data-i18n="auth.loginTitle">РЕГИСТРАЦИЯ</h2>
        <div class="error-msg" id="loginError"></div>

        <div class="input-group">
          <label data-i18n="auth.email">Email</label>
          <input type="email" id="loginUser">
        </div>

        <div class="input-group">
          <label data-i18n="auth.password">Пароль</label>
          <input type="password" id="loginPass">
        </div>

        <button class="btn-auth" style="width:100%" onclick="authAPI.login()" data-i18n="auth.loginBtn">ВОЙТИ</button>
        <div class="switch-form" onclick="ui.toggleForms()" data-i18n="auth.noAccount">Нет аккаунта? Регистрация</div>
      </div>

      <div id="registerForm" style="display:none;">
        <h2 class="auth-title" data-i18n="auth.registerTitle">РЕГИСТРАЦИЯ</h2>
        <div class="error-msg" id="regError"></div>

        <div class="input-group">
          <label data-i18n="auth.email">Email</label>
          <input type="email" id="regUser">
        </div>

        <div class="input-group">
          <label data-i18n="auth.password">Пароль</label>
          <input type="password" id="regPass">
        </div>

        <button class="btn-auth" style="width:100%" onclick="authAPI.register()" data-i18n="auth.registerBtn">СОЗДАТЬ</button>
        <div class="switch-form" onclick="ui.toggleForms()" data-i18n="auth.hasAccount">Есть аккаунт? Войти</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="movieModal">
    <div class="movie-info-card">
      <span class="close-modal" onclick="kinopoiskAPI.closeModal()">×</span>

      <div class="movie-content-wrapper">
        <div class="movie-poster-col">
          <img id="modalPoster" src="" alt="Poster" class="full-poster">
          <div class="modal-rating" id="modalRating">0.0</div>
        </div>

        <div class="movie-info-col">
          <h2 id="modalTitle" class="movie-big-title">TITLE</h2>
          <div id="modalYear" class="movie-meta">YEAR</div>

          <div class="movie-desc-box">
            <p id="modalDesc">...</p>
          </div>

          <div id="seasonsContainer" class="info-section"></div>
          <div id="factsContainer" class="info-section"></div>

          <div class="player-wrapper">
            <div class="player-label" id="playerLabel">VIDEO UPLINK</div>
            <iframe id="modalPlayer" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          </div>

          <div id="similarsContainer" class="info-section"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
