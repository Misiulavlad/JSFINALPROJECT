<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Universe</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- 🔥 СКРИПТ МГНОВЕННОЙ ЗАГРУЗКИ ТЕМЫ 🔥 -->
    <script>
        (function() {
            // Те же цвета, что и в main.js
            const themes = {
                red: { glow: '255,0,60', accent: '#ff003c' },
                blue: { glow: '0,102,255', accent: '#0066ff' },
                green: { glow: '0,204,102', accent: '#00cc66' },
                purple: { glow: '153,51,255', accent: '#9933ff' },
                cyan: { glow: '0,204,204', accent: '#00cccc' },
                orange: { glow: '255,102,0', accent: '#ff6600' },
                pink: { glow: '255,51,153', accent: '#ff3399' },
                yellow: { glow: '255,204,0', accent: '#ffcc00' }
            };

            // 1. Берем сохраненную тему или ставим красную по умолчанию
            const savedTheme = localStorage.getItem('theme') || 'red';
            const theme = themes[savedTheme] || themes['red'];

            // 2. Применяем CSS переменные СРАЗУ, до отрисовки страницы
            const root = document.documentElement;
            root.style.setProperty('--glow-color', theme.glow);
            root.style.setProperty('--accent-color', theme.accent);
            root.style.setProperty('--card-border', `rgba(${theme.glow},0.4)`);
            root.style.setProperty('--blob-gradient', `radial-gradient(circle, rgba(${theme.glow},0.4) 0%, rgba(${theme.glow},0) 70%)`);
        })();
    </script>
</head>
<body>

    <!-- ФОН (БЛОБЫ) -->
    <div class="blobs-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav class="navbar">
        <div class="nav-logo" onclick="resetToMain()">CYBER<span>CINEMA</span></div>
        <div class="nav-center">
            <button class="nav-btn active" onclick="switchPage('search')">ПОИСК</button>
            <button class="nav-btn" onclick="switchPage('cinema')">КАТАЛОГ</button>
            <button class="nav-btn" onclick="switchPage('settings')">НАСТРОЙКИ</button>
        </div>
        <button class="btn-auth" id="navAuthBtn">ЗАГРУЗКА...</button>
    </nav>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <span class="close-modal" id="closeAuthModal">×</span>
            
            <!-- ВХОД -->
            <div id="loginForm">
                <h2 class="auth-title">ВХОД</h2>
                <div class="error-msg" id="loginError"></div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginUser">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPass">
                </div>
                <button class="btn-auth" style="width:100%" onclick="authAPI.login()">ВОЙТИ</button>
                <div class="switch-form" onclick="ui.toggleForms()">Нет аккаунта? Регистрация</div>
            </div>

            <!-- РЕГИСТРАЦИЯ -->
            <div id="registerForm" style="display: none;">
                <h2 class="auth-title">РЕГИСТРАЦИЯ</h2>
                <div class="error-msg" id="regError"></div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regUser">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="regPass">
                </div>
                <button class="btn-auth" style="width:100%" onclick="authAPI.register()">СОЗДАТЬ</button>
                <div class="switch-form" onclick="ui.toggleForms()">Есть аккаунт? Войти</div>
            </div>
        </div>
    </div>

    <!-- СТРАНИЦА 1: ПОИСК (ГЛАВНАЯ) -->
    <div class="page active" id="searchPage">
        <div class="search-card">
            <h1 style="color: var(--text-main); text-align: center; margin-bottom: 20px; font-family: 'Orbitron'; letter-spacing: 2px;">GLOBAL SEARCH</h1>
            
            <div class="search-container">
                <input type="text" class="search-input" placeholder="ВВЕДИТЕ НАЗВАНИЕ ФИЛЬМА..." id="globalSearch">
            </div>

            <!-- СЮДА ВЫВОДЯТСЯ РЕЗУЛЬТАТЫ ПОИСКА -->
            <div id="apiResult" class="movies-grid" style="margin-top: 30px;"></div>

            <div class="status" id="statusInfo" style="margin-top: 20px;">SYSTEM: ONLINE | THEME: RED</div>
        </div>
    </div>

    <!-- СТРАНИЦА 2: КАТАЛОГ -->
    <div class="page" id="cinemaPage">
        <div class="movies-container">
            <div class="movies-header">
                <h1>РЕКОМЕНДАЦИИ СИСТЕМЫ</h1>
            </div>
            <div class="movies-grid" id="moviesGrid">
                <!-- Генерируется в JS -->
            </div>
        </div>
    </div>

    <!-- СТРАНИЦА 3: НАСТРОЙКИ -->
    <div class="page" id="settingsPage">
        <div class="settings-card">
            <div class="settings-section">
                <h2 class="settings-title">ЦВЕТ ИНТЕРФЕЙСА</h2>
                <div class="color-picker">
                    <div class="color-option" data-color="red" style="background: #ff003c;" onclick="setTheme('red')"></div>
                    <div class="color-option" data-color="blue" style="background: #0066ff;" onclick="setTheme('blue')"></div>
                    <div class="color-option" data-color="green" style="background: #00cc66;" onclick="setTheme('green')"></div>
                    <div class="color-option" data-color="purple" style="background: #9933ff;" onclick="setTheme('purple')"></div>
                    <div class="color-option" data-color="cyan" style="background: #00cccc;" onclick="setTheme('cyan')"></div>
                    <div class="color-option" data-color="orange" style="background: #ff6600;" onclick="setTheme('orange')"></div>
                    <div class="color-option" data-color="pink" style="background: #ff3399;" onclick="setTheme('pink')"></div>
                    <div class="color-option" data-color="yellow" style="background: #ffcc00;" onclick="setTheme('yellow')"></div>
                </div>
            </div>
            <div class="settings-section">
                <h2 class="settings-title">ДАННЫЕ</h2>
                <div class="status" style="text-align: left;">
                    <p>Тема: <span id="currentTheme">Красная</span></p>
                    <p>Аккаунт: <span id="currentUserInfo" style="color: var(--accent-color)">Guest</span></p>
                </div>
            </div>
            <button class="btn-auth" style="width: 100%; margin-top: 20px;" onclick="resetToDefault()">СБРОС НАСТРОЕК</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФИЛЬМА -->
    <div class="modal-overlay" id="movieModal">
        <div class="movie-info-card">
            <span class="close-modal" onclick="kinopoiskAPI.closeModal()">×</span>
            
            <div class="movie-content-wrapper">
                <div class="movie-poster-col">
                    <img id="modalPoster" src="" alt="Poster" class="full-poster">
                    <div class="modal-rating" id="modalRating">0.0</div>
                </div>

                <div class="movie-info-col">
                    <h2 id="modalTitle" class="movie-big-title">TITLE</h2>
                    <div id="modalYear" class="movie-meta">YEAR: 2024</div>
                    
                    <div class="movie-desc-box">
                        <p id="modalDesc">Описание загружается...</p>
                    </div>

                    <div class="player-wrapper">
                        <div class="player-label">VIDEO UPLINK ESTABLISHED</div>
                        <!-- Плеер -->
                        <iframe id="modalPlayer" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        <!-- Кнопка появится тут через JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ JS -->
    <script type="module" src="./main.js"></script>
</body>
</html>
